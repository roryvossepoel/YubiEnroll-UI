name: Build Windows preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Test and publish
        shell: pwsh
        run: ./build.ps1 -Runtime win-x64
      - name: Test published executables and actual startup paths
        shell: pwsh
        run: |
          $mock = (Resolve-Path ./tests/YubiEnroll.Tests/bin/Release/net10.0/YubiEnroll.Tests.exe).Path
          $testArgs = '--smoke-test "' + $mock + '"'
          $app = Start-Process ./artifacts/win-x64/app/YubiEnroll.UI.exe -ArgumentList $testArgs -PassThru
          if (-not $app.WaitForExit(60000)) {
            $app.Kill()
            Get-Content ./artifacts/win-x64/app/startup-smoke-test.txt -ErrorAction SilentlyContinue
            throw 'Startup smoke test timed out'
          }
          Get-Content ./artifacts/win-x64/app/startup-smoke-test.txt
          if ($app.ExitCode -ne 0) { throw "Startup smoke test failed: $($app.ExitCode)" }
          & ./artifacts/win-x64/app/YubiEnroll.ConsoleHost.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Bundled console host could not start' }
      - name: Verify configuration with YubiEnroll 1.2.0
        shell: pwsh
        run: ./tests/Test-YubiEnrollCompatibility.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: YubiEnroll-UI-win-x64
          path: |
            artifacts/win-x64/app/*
            !artifacts/win-x64/app/startup-smoke-test.txt
          if-no-files-found: error
          retention-days: 30
