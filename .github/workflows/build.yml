name: Build Windows preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Test and publish
        shell: pwsh
        run: ./build.ps1 -Runtime ${{ matrix.runtime }}
      - name: Load WPF window without YubiEnroll or network calls
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          $app = Start-Process ./artifacts/win-x64/app/YubiEnroll.UI.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $app.WaitForExit(30000)) { $app.Kill(); throw 'WPF smoke test timed out' }
          if ($app.ExitCode -ne 0) { throw "WPF smoke test failed: $($app.ExitCode)" }
      - uses: actions/upload-artifact@v7
        with:
          name: YubiEnroll-UI-${{ matrix.runtime }}
          path: artifacts/${{ matrix.runtime }}/YubiEnroll-UI-${{ matrix.runtime }}.zip
          if-no-files-found: error
          retention-days: 30
