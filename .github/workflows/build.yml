name: Build Windows app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Test read-only capability probe
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Test and publish
        shell: pwsh
        run: ./build.ps1 -Runtime win-x64
      - name: Verify and archive the Windows build
        shell: pwsh
        run: |
          $out = 'artifacts/win-x64/app'
          foreach ($name in 'PasskeyDesk.exe', 'PasskeyDesk.ConsoleHost.exe') {
            $file = Get-Item "$out/$name"
            $info = $file.VersionInfo
            if ($info.ProductName -ne 'Passkey Desk for YubiKeys' -or ($info.ProductVersion -split '\+')[0] -ne '0.11.4') {
              throw "Unexpected executable metadata for $name"
            }
            Write-Output "$name $($info.ProductVersion) $($file.Length) bytes"
            Get-FileHash $file.FullName -Algorithm SHA256
          }
          if (!(Test-Path "$out/policy/PasskeyDesk.admx") -or !(Test-Path "$out/policy/en-US/PasskeyDesk.adml")) {
            throw 'Policy templates missing from the preview'
          }
      - name: Verify published application and console icons
        run: python tests/check_published_icons.py artifacts/win-x64/app
      - uses: actions/upload-artifact@v7
        with:
          name: PasskeyDesk-0.11.4-win-x64
          path: artifacts/win-x64/app/
          if-no-files-found: error
          retention-days: 30
      - name: Verify internal signing on disposable copies
        timeout-minutes: 2
        shell: pwsh
        run: ./tests/Test-InternalSigning.ps1
      - name: Test published executables and actual startup paths
        shell: pwsh
        run: |
          $mock = (Resolve-Path ./tests/YubiEnroll.Tests/bin/Release/net10.0/YubiEnroll.Tests.exe).Path
          $testArgs = '--smoke-test "' + $mock + '"'
          $app = Start-Process ./artifacts/win-x64/app/PasskeyDesk.exe -ArgumentList $testArgs -PassThru
          if (-not $app.WaitForExit(60000)) {
            $app.Kill()
            Get-Content ./artifacts/win-x64/app/startup-smoke-test.txt -ErrorAction SilentlyContinue
            throw 'Startup smoke test timed out'
          }
          Get-Content ./artifacts/win-x64/app/startup-smoke-test.txt
          if ($app.ExitCode -ne 0) { throw "Startup smoke test failed: $($app.ExitCode)" }
          & ./artifacts/win-x64/app/PasskeyDesk.ConsoleHost.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Bundled console host could not start' }
      - name: Verify configuration with YubiEnroll 1.2.0
        shell: pwsh
        run: ./tests/Test-YubiEnrollCompatibility.ps1
      - name: Verify optional YubiKey Manager CLI 5.9.2
        shell: pwsh
        run: ./tests/Test-YkmanCompatibility.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: UI-visual-checks
          path: artifacts/win-x64/app/visual-checks/*.png
          if-no-files-found: error
          retention-days: 7
